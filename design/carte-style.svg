<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" font-family="IBM Plex Mono, Consolas, monospace">
  <title>Échantillon de style de la carte du mode Distance (schéma, pas une vraie carte)</title>
  <!-- Couleurs = tokens --carte-* de src/styles/tokens.css -->
  <rect width="480" height="300" fill="#070a0e"/>
  <!-- « Hexagone » schématique -->
  <path d="M150 30 L330 22 L420 110 L380 250 L210 280 L80 200 L95 90 Z" fill="#18212b" stroke="#56677c" stroke-width="1"/>
  <!-- limite administrative éventuelle -->
  <path d="M95 140 L250 150 L380 140" fill="none" stroke="#222c38" stroke-width="1"/>
  <!-- fleuves -->
  <path d="M330 40 C 300 90 320 140 300 190 C 290 230 300 255 305 275" fill="none" stroke="#2c5f86" stroke-width="1.25"/>
  <path d="M120 180 C 170 160 210 170 250 150 C 280 135 300 130 315 120" fill="none" stroke="#2c5f86" stroke-width="1.25"/>
  <!-- repère de ville -->
  <circle cx="215" cy="100" r="2" fill="#8593a2"/>
  <text x="221" y="104" font-size="10" fill="#8593a2">Ville</text>
  <!-- résultat : trait proposition → réponse -->
  <line x1="262" y1="214" x2="300" y2="190" stroke="#e4eaf0" stroke-width="1.5" stroke-dasharray="4 3"/>
  <!-- marqueur du joueur : rond plein accent, anneau -->
  <circle cx="262" cy="214" r="9" fill="none" stroke="#4db8ff" stroke-width="1.5"/>
  <circle cx="262" cy="214" r="4" fill="#4db8ff"/>
  <!-- marqueur de la réponse : losange blanc (forme différente, pas seulement la couleur) -->
  <path d="M300 182 L308 190 L300 198 L292 190 Z" fill="#e4eaf0" stroke="#070a0e" stroke-width="1"/>
  <!-- étiquette de distance -->
  <rect x="300" y="203" width="64" height="18" fill="#0a0e13" stroke="#627285"/>
  <text x="308" y="216" font-size="11" fill="#e4eaf0">34 km</text>
  <!-- légende -->
  <g font-size="9" fill="#a3afbc" letter-spacing=".7">
    <circle cx="20" cy="262" r="4" fill="#4db8ff"/><text x="30" y="265">VOTRE REPÈRE</text>
    <path d="M20 274 L25 279 L20 284 L15 279 Z" fill="#e4eaf0"/><text x="30" y="282">POSITION RÉELLE</text>
  </g>
</svg>
