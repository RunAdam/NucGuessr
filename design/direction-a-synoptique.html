/*
 * NucGuessr — design tokens (phase 3, direction « Synoptique »).
 *
 * Fichier unique des valeurs visuelles : toute couleur, police, taille, espacement, rayon ou durée
 * utilisée dans l'interface doit venir d'ici (aucune valeur en dur dans les composants).
 * Guide d'usage : design/TOKENS.md. Choix et tests : design/CHOIX.md, docs/decisions-phase3.md.
 * Contrastes vérifiés par `python -I design/tests/contraste.py` (WCAG AA) : relancer après toute
 * modification d'une couleur.
 *
 * Préfixes : --c-* couleurs, --police-* / --taille-* typographie, --esp-* espacements,
 * --rayon-* rayons, --duree-* / --courbe-* animations, --carte-* carte du mode Distance.
 */

:root {
  color-scheme: dark;

  /* ---------------------------------------------------------------------------
   * Couleurs — fond et surfaces (quasi noir, teinté bleu nuit)
   * ------------------------------------------------------------------------- */
  --c-fond: #0a0e13;            /* fond de page */
  --c-surface: #10161d;         /* panneaux (bandeau, journal) */
  --c-surface-2: #161e27;       /* champ de saisie, liste de suggestions, survol */
  --c-trait: #253140;           /* filets, graduations secondaires, séparateurs (décoratif) */
  --c-trait-fort: #627285;      /* contour des composants interactifs (≥ 3:1 sur le fond et sur --c-surface-2) */

  /* Textes : 3 niveaux de gris, tous ≥ 4,5:1 sur --c-fond et --c-surface-2 */
  --c-texte: #e4eaf0;           /* texte principal, chiffres */
  --c-texte-2: #a3afbc;         /* texte secondaire, libellés */
  --c-texte-3: #8593a2;         /* texte tertiaire : unités, texte fantôme de l'autocomplétion */

  /* Accent unique : bleu Tcherenkov. Réservé au temps restant, au focus et à l'élément actif.
     Ne jamais introduire un second accent. */
  --c-accent: #4db8ff;
  --c-accent-doux: rgb(77 184 255 / 0.14);  /* fond de la suggestion active, halo du focus */
  --c-sur-accent: #04121f;                  /* texte posé sur un aplat d'accent */

  /* Statuts : toujours doublés d'une forme (icône ✓ / ✕ dessinée en SVG), d'un mot ou d'un barré.
     La couleur seule ne porte jamais l'information (daltonisme). */
  --c-succes: #5fd39a;
  --c-succes-doux: rgb(95 211 154 / 0.14);
  --c-erreur: #ff6b5e;
  --c-erreur-doux: rgb(255 107 94 / 0.16);

  /* ---------------------------------------------------------------------------
   * Typographie — IBM Plex Sans (texte, titres) + IBM Plex Mono (tous les chiffres)
   * Polices auto-hébergées : voir src/styles/fonts.css et public/fonts/.
   * ------------------------------------------------------------------------- */
  --police-texte: "IBM Plex Sans", "Segoe UI", Roboto, sans-serif;
  --police-chiffres: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  --graisse-normale: 400;
  --graisse-forte: 600;
  /* À appliquer à tout nombre qui change (chrono, score, distance) avec --police-chiffres.
     Plex Mono est à chasse fixe (largeur stable, mesurée : 0 px d'écart de « 0,0 » à « 20,0 ») et son
     zéro est pointé par défaut (0 ≠ O). La déclaration garde des chiffres tabulaires si la police de
     secours s'affiche. Séparateur de milliers : espace insécable U+00A0 (U+202F absent du sous-ensemble). */
  --chiffres-variante: tabular-nums;

  /* Échelle (rem = 16 px). Les tailles « chrono » et « score » sont fluides : lisibles à 360 px
     comme à 1280 px. */
  --taille-micro: 0.6875rem;    /* 11 px — libellés d'instrument en capitales (CANAL, ROUND) */
  --taille-petite: 0.8125rem;   /* 13 px — légendes, graduations */
  --taille-base: 1rem;          /* 16 px — texte courant */
  --taille-saisie: 1.25rem;     /* 20 px — champ de saisie (≥ 16 px : pas de zoom auto sur iOS) */
  --taille-titre: 1.5rem;       /* 24 px */
  --taille-score: clamp(1.25rem, 1rem + 1vw, 1.75rem);   /* 20 → 28 px */
  --taille-chrono: clamp(1.875rem, 1.2rem + 2.2vw, 2.75rem); /* 30 → 44 px (chiffre de 21 à 31 px de haut) */
  --interlettre-libelle: 0.08em; /* capitales des libellés d'instrument */
  --interligne: 1.4;

  /* ---------------------------------------------------------------------------
   * Espacements (base 4 px) et dimensions
   * ------------------------------------------------------------------------- */
  --esp-1: 0.25rem;  /* 4 px */
  --esp-2: 0.5rem;   /* 8 px */
  --esp-3: 0.75rem;  /* 12 px */
  --esp-4: 1rem;     /* 16 px */
  --esp-5: 1.5rem;   /* 24 px */
  --esp-6: 2rem;     /* 32 px */
  --esp-7: 3rem;     /* 48 px */

  --trait-fin: 1px;              /* épaisseur des filets et graduations */
  --hauteur-barre-temps: 0.75rem; /* 12 px : la barre de temps */
  --hauteur-saisie: 3.25rem;     /* 52 px : champ de saisie (cible tactile confortable) */
  --hauteur-suggestion: 2.5rem;  /* 40 px : une suggestion (≥ 40 px au doigt) */
  --largeur-max-jeu: 80rem;      /* 1280 px */

  /* ---------------------------------------------------------------------------
   * Rayons : quasi droits, comme un pupitre. Pas de cartes arrondies.
   * ------------------------------------------------------------------------- */
  --rayon-0: 0;
  --rayon-1: 2px;   /* champs, boutons, suggestions */
  --rayon-rond: 50%; /* uniquement les marqueurs de carte et les voyants */

  /* ---------------------------------------------------------------------------
   * Animations : chacune a un rôle (temps qui passe, erreur, révélation). Rien de décoratif.
   * ------------------------------------------------------------------------- */
  --duree-instant: 80ms;      /* survol, changement de suggestion active */
  --duree-courte: 160ms;      /* apparition de la liste de suggestions, du « −2 s » */
  --duree-secousse: 300ms;    /* secousse du champ après une mauvaise réponse */
  --duree-saut-temps: 450ms;  /* le segment de 2 s perdu s'efface de la barre de temps */
  --duree-penalite: 900ms;    /* durée d'affichage du « −2 s » */
  --duree-revelation: 240ms;  /* apparition de la bonne réponse */
  --duree-camera-carte: 700ms; /* recadrage de la carte sur proposition + réponse (Distance) */
  --courbe-sortie: cubic-bezier(0.2, 0, 0, 1);  /* décélération : apparitions */
  --courbe-secousse: cubic-bezier(0.36, 0.07, 0.19, 0.97);
  --amplitude-secousse: 6px;  /* déplacement horizontal maximal de la secousse */
  --seuil-alerte-s: 5;        /* sous ce nombre de secondes, la barre passe en --c-erreur (info, lue en JS) */

  /* ---------------------------------------------------------------------------
   * Carte du mode Distance (style « synoptique » : traits fins sur fond sombre)
   * ------------------------------------------------------------------------- */
  --carte-mer: #070a0e;               /* plus sombre que le fond : la terre ressort */
  --carte-terre: #18212b;
  --carte-frontiere: #56677c;         /* contour de la France et frontières (≥ 3:1 sur la mer) */
  --carte-frontiere-epaisseur: 1px;
  --carte-limite-region: #222c38;     /* limites administratives éventuelles, très discrètes */
  --carte-fleuve: #2c5f86;            /* bleu désaturé, nettement distinct de l'accent */
  --carte-fleuve-epaisseur: 1.25px;
  --carte-ville: #8593a2;             /* repères éventuels (points + noms en --taille-petite) */
  --carte-marqueur-joueur: #4db8ff;   /* proposition du joueur = accent (élément actif) */
  --carte-marqueur-reponse: #e4eaf0;  /* position réelle : blanc, forme différente (losange) */
  --carte-trait: #e4eaf0;             /* trait proposition → réponse, en tirets */
  --carte-trait-tirets: 4 3;          /* stroke-dasharray */
  --carte-trait-epaisseur: 1.5px;
  --carte-cercle-parfait: rgb(95 211 154 / 0.35); /* rayon « dans le mille » (5 km), si affiché */
}

/* Mouvement réduit : la secousse et les déplacements disparaissent, l'information reste portée par
   la couleur du contour, le barré et le « −2 s » (qui apparaît sans glisser). */
@media (prefers-reduced-motion: reduce) {
  :root {
    --amplitude-secousse: 0px;
    --duree-saut-temps: 0ms;
    --duree-camera-carte: 0ms;
    --duree-revelation: 0ms;
  }
}

/*@tokens:fin*/

/* --- Variantes testées (hors tokens retenus) ------------------------------------------- */
[data-typo="jetbrains"] { --police-texte: "Space Grotesk", sans-serif; --police-chiffres: "JetBrains Mono", monospace; }
[data-typo="barlow"]    { --police-texte: "Barlow Semi Condensed", sans-serif; --police-chiffres: "Space Mono", monospace; }
[data-palette="graphite"] {
  --c-fond: #0d0d0e; --c-surface: #151516; --c-surface-2: #1c1c1e; --c-trait: #2c2c2f; --c-trait-fort: #5f5f66;
  --c-texte: #ececec; --c-texte-2: #a8a8ad; --c-texte-3: #8a8a90;
  --c-accent: #3d8bff; --c-accent-doux: rgb(61 139 255 / 0.16); --c-sur-accent: #ffffff;
  --c-succes: #4cc38a; --c-erreur: #f2555a; --c-erreur-doux: rgb(242 85 90 / 0.16);
}

/* --- Base ------------------------------------------------------------------------------- */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--c-fond); color: var(--c-texte);
  font: var(--graisse-normale) var(--taille-base)/var(--interligne) var(--police-texte);
  -webkit-font-smoothing: antialiased;
}
.num { font-family: var(--police-chiffres); font-variant-numeric: var(--chiffres-variante); }
.libelle {
  font-family: var(--police-chiffres); font-size: var(--taille-micro); text-transform: uppercase;
  letter-spacing: var(--interlettre-libelle); color: var(--c-texte-2);
}
.icone { width: 1em; height: 1em; flex: none; stroke: currentColor; stroke-width: 2.2; fill: none; stroke-linecap: square; }

/* --- Gabarit bureau ------------------------------------------------------------------------ */
.jeu {
  height: 100%; max-width: var(--largeur-max-jeu); margin: 0 auto;
  display: grid; grid-template-columns: minmax(0, 1fr) 20rem; grid-template-rows: auto minmax(0, 1fr) auto;
  grid-template-areas: "bandeau bandeau" "ecran pupitre" "temps pupitre";
  column-gap: var(--esp-5); padding: 0 var(--esp-5) var(--esp-5);
}

/* Bandeau : une ligne d'instrumentation, filet en bas, rien de centré */
.bandeau {
  grid-area: bandeau; display: flex; align-items: center; gap: var(--esp-5);
  height: 3.25rem; border-bottom: var(--trait-fin) solid var(--c-trait); margin-bottom: var(--esp-4);
}
.bandeau .marque { height: 1.25rem; width: auto; display: block; }
.bandeau .mode { padding-left: var(--esp-4); border-left: var(--trait-fin) solid var(--c-trait); }
.voyants { display: flex; align-items: center; gap: var(--esp-2); margin-left: auto; }
.voyants ol { display: flex; gap: 3px; list-style: none; margin: 0 0 0 var(--esp-2); padding: 0; }
.voyants li { width: 0.75rem; height: 0.75rem; border: var(--trait-fin) solid var(--c-trait-fort); display: grid; place-items: center; color: var(--c-erreur); }
.voyants li.ok { background: var(--c-succes); border-color: var(--c-succes); }
.voyants li.ko { border-color: var(--c-erreur); }
.voyants li.ko .icone { width: 0.55rem; height: 0.55rem; stroke-width: 3; }
.voyants li.encours { border: 2px solid var(--c-accent); }
.voyants .num { font-size: var(--taille-base); color: var(--c-texte); }
.score { display: flex; align-items: baseline; gap: var(--esp-2); padding-left: var(--esp-5); border-left: var(--trait-fin) solid var(--c-trait); }
.score .valeur { font-size: var(--taille-score); font-weight: var(--graisse-forte); }
.score .sur { color: var(--c-texte-3); font-size: var(--taille-petite); }

/* Écran : la photo, cadrée comme un moniteur (repères d'angle, légende de canal) */
.ecran { grid-area: ecran; position: relative; min-height: 0; display: flex; }
.photo { position: relative; flex: 1; min-height: 0; background: #1a222c; overflow: hidden; }
.photo svg { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.ecran::before, .ecran::after {
  content: ""; position: absolute; width: 1.25rem; height: 1.25rem; z-index: 2; pointer-events: none;
  border: 0 solid var(--c-texte-2);
}
.ecran::before { top: -6px; left: -6px; border-top-width: 1px; border-left-width: 1px; }
.ecran::after { bottom: -6px; right: -6px; border-bottom-width: 1px; border-right-width: 1px; }
.canal { position: absolute; top: var(--esp-2); left: var(--esp-3); z-index: 2; color: var(--c-texte-2); text-shadow: 0 1px 2px #000; }
.credit { position: absolute; bottom: var(--esp-2); right: var(--esp-3); z-index: 2; font-size: var(--taille-micro); color: var(--c-texte-2); text-shadow: 0 1px 2px #000; }

/* Révélation de la réponse : bande en bas de la photo */
.revelation {
  position: absolute; left: 0; right: 0; bottom: 0; z-index: 3; display: none; align-items: center; gap: var(--esp-3);
  padding: var(--esp-3) var(--esp-4); background: var(--c-fond); border-top: 2px solid var(--c-succes);
  animation: revele var(--duree-revelation) var(--courbe-sortie);
}
.revelation .icone { width: 1.5rem; height: 1.5rem; color: var(--c-succes); }
.revelation .nom { font-size: var(--taille-titre); font-weight: var(--graisse-forte); }
.revelation .detail { margin-left: auto; color: var(--c-texte-2); }
.revelation .points { font-size: var(--taille-titre); font-weight: var(--graisse-forte); color: var(--c-succes); margin-left: var(--esp-3); }
.revelation.perdu { border-top-color: var(--c-erreur); }
.revelation.perdu .icone, .revelation.perdu .points { color: var(--c-erreur); }
[data-etat="bonne"] .revelation, [data-etat="perdu"] .revelation { display: flex; }
@keyframes revele { from { transform: translateY(100%); } }

/* --- Temps : chrono numérique + barre graduée ------------------------------------------------ */
.temps { grid-area: temps; display: flex; align-items: flex-end; gap: var(--esp-4); padding-top: var(--esp-3); }
.chrono { display: flex; align-items: baseline; gap: 2px; min-width: 5.2ch; }
.chrono .valeur { font-size: var(--taille-chrono); font-weight: var(--graisse-forte); line-height: 1; color: var(--c-accent); display: inline-block; min-width: 4ch; text-align: right; }
.chrono .unite { font-size: var(--taille-base); color: var(--c-texte-3); }
[data-alerte] .chrono .valeur { color: var(--c-erreur); }
.jauge { position: relative; flex: 1; padding-top: 1.25rem; }
.jauge .rail { position: relative; height: var(--hauteur-barre-temps); background: var(--c-surface-2); }
.jauge .rempli { position: absolute; inset: 0 auto 0 0; background: var(--c-accent); }
[data-alerte] .jauge .rempli { background: var(--c-erreur); }
.jauge .perte {
  position: absolute; top: 0; bottom: 0; background: repeating-linear-gradient(-45deg, var(--c-erreur) 0 4px, transparent 4px 6px);
  border: 1px solid var(--c-erreur); animation: efface var(--duree-saut-temps) var(--courbe-sortie) var(--duree-penalite) forwards;
}
@keyframes efface { to { opacity: 0; } }
.jauge .moins {
  position: absolute; top: 0; transform: translateX(-50%); font-family: var(--police-chiffres); font-weight: var(--graisse-forte);
  font-size: var(--taille-petite); color: var(--c-erreur); line-height: 1; white-space: nowrap;
}
.graduations { position: relative; height: 1.1rem; margin-top: 2px; }
.graduations i { position: absolute; top: 0; width: 1px; height: 4px; background: var(--c-trait-fort); }
.graduations i.maj { height: 7px; background: var(--c-texte-3); }
.graduations b { position: absolute; top: 6px; transform: translateX(-50%); font: var(--graisse-normale) var(--taille-micro) var(--police-chiffres); color: var(--c-texte-3); }

/* Variante « expo » : aire sous une exponentielle (métaphore de la décroissance) */
.jauge svg.courbe { display: block; width: 100%; height: 3rem; overflow: visible; }
/* Variante « grappes » : 20 barres de contrôle, une par seconde */
.grappes { display: grid; grid-template-columns: repeat(20, 1fr); gap: 3px; height: 1.75rem; }
.grappes span { position: relative; background: var(--c-accent); overflow: hidden; }
.grappes span u { position: absolute; left: 0; right: 0; top: 0; background: var(--c-surface-2); border-bottom: 1px solid var(--c-trait-fort); }
.grappes span.chute u { background: var(--c-erreur); }
[data-alerte] .grappes span { background: var(--c-erreur); }

/* --- Pupitre : saisie, suggestions, essais, journal ------------------------------------------ */
.pupitre { grid-area: pupitre; display: flex; flex-direction: column; gap: var(--esp-3); min-height: 0; }
.champ { position: relative; }
.champ label { display: block; margin-bottom: var(--esp-2); }
.zone {
  position: relative; height: var(--hauteur-saisie); background: var(--c-surface-2);
  border: var(--trait-fin) solid var(--c-trait-fort); border-radius: var(--rayon-1);
  display: flex; align-items: center;
}
.zone:focus-within { border-color: var(--c-accent); box-shadow: 0 0 0 3px var(--c-accent-doux); }
.zone input, .zone .fantome {
  position: absolute; inset: 0; padding: 0 2.75rem 0 var(--esp-4); border: 0; margin: 0; background: transparent;
  font: var(--graisse-normale) var(--taille-saisie) var(--police-texte); color: var(--c-texte); outline: none;
  display: flex; align-items: center; white-space: pre; width: 100%;
}
.zone .fantome { color: var(--c-texte-3); pointer-events: none; }
.zone .fantome span { color: transparent; }
.zone .etat-icone { position: absolute; right: var(--esp-3); width: 1.25rem; height: 1.25rem; display: none; }
[data-etat="erreur"] .zone { border-color: var(--c-erreur); box-shadow: 0 0 0 3px var(--c-erreur-doux); animation: secousse var(--duree-secousse) var(--courbe-secousse); }
[data-etat="erreur"] .zone .ko { display: block; color: var(--c-erreur); }
[data-etat="bonne"] .zone { border-color: var(--c-succes); }
[data-etat="bonne"] .zone .ok { display: block; color: var(--c-succes); }
@keyframes secousse {
  20%, 60% { transform: translateX(calc(var(--amplitude-secousse) * -1)); }
  40%, 80% { transform: translateX(var(--amplitude-secousse)); }
}
.message { min-height: 1.25rem; font-size: var(--taille-petite); color: var(--c-texte-2); display: flex; gap: var(--esp-2); align-items: center; }
.message .icone { color: var(--c-erreur); }
.suggestions { list-style: none; margin: 0; padding: 0; border: var(--trait-fin) solid var(--c-trait); background: var(--c-surface); }
.suggestions li {
  height: var(--hauteur-suggestion); display: flex; align-items: center; justify-content: space-between;
  padding: 0 var(--esp-4); border-left: 2px solid transparent; cursor: pointer;
}
.suggestions li + li { border-top: var(--trait-fin) solid var(--c-trait); }
.suggestions li.actif { background: var(--c-accent-doux); border-left-color: var(--c-accent); }
.suggestions li mark { background: none; color: var(--c-texte); font-weight: var(--graisse-forte); }
.suggestions li .touche { font: var(--taille-micro) var(--police-chiffres); color: var(--c-texte-3); border: 1px solid var(--c-trait-fort); padding: 0 4px; border-radius: var(--rayon-1); }
.suggestions li:not(.actif) .touche { visibility: hidden; }
.essais { display: flex; flex-wrap: wrap; gap: var(--esp-1) var(--esp-3); align-items: baseline; font-size: var(--taille-petite); }
.essais-photo { display: none; }
.suggestions:empty { display: none; }
.essais s { color: var(--c-texte-2); text-decoration-color: var(--c-erreur); text-decoration-thickness: 2px; }
.journal { margin-top: auto; border-top: var(--trait-fin) solid var(--c-trait); padding-top: var(--esp-3); }
.journal table { width: 100%; border-collapse: collapse; font-size: var(--taille-petite); }
.journal td { padding: 3px 0; color: var(--c-texte-2); }
.journal td.num { text-align: right; color: var(--c-texte); }
.journal tr.ko td.num { color: var(--c-texte-3); }
.journal .icone { width: 0.75rem; height: 0.75rem; vertical-align: -1px; }
.journal .ok .icone { color: var(--c-succes); } .journal .ko .icone { color: var(--c-erreur); }

/* --- Mobile (clavier ouvert : ~360 × 400 visibles) ------------------------------------------ */
@media (max-width: 719px) {
  .jeu {
    grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr) auto auto;
    grid-template-areas: "bandeau" "ecran" "temps" "pupitre"; padding: 0 var(--esp-3) var(--esp-2); column-gap: 0;
  }
  .bandeau { height: 2.25rem; gap: var(--esp-3); margin-bottom: var(--esp-2); }
  .bandeau .marque, .bandeau .mode, .voyants ol, .score .sur, .journal { display: none; }
  .voyants { margin-left: 0; }
  .score { margin-left: auto; padding-left: 0; border: 0; }
  .score .valeur { font-size: var(--taille-base); }
  .ecran::before, .ecran::after { display: none; }
  .canal { display: none; }
  .temps { padding-top: var(--esp-1); gap: var(--esp-3); align-items: center; }
  .jauge { padding-top: 0.9rem; }
  .graduations { display: none; }
  .chrono { min-width: 4.4ch; }
  .pupitre { gap: var(--esp-2); padding-top: var(--esp-2); }
  .champ label { display: none; }
  .message { display: none; }
  /* Essais barrés : posés sur la photo, en bas à gauche */
  .pupitre .essais { display: none; }
  .essais-photo:not(:empty) { display: flex; }
  .essais-photo { position: absolute; z-index: 2; left: var(--esp-2); bottom: var(--esp-2); max-width: 70%; background: var(--c-fond); padding: 2px var(--esp-2); }
  .essais .libelle { display: none; }
  /* Suggestions : une rangée de puces au-dessus du champ, comme la barre du clavier */
  .suggestions { order: -1; display: flex; border: 0; background: none; gap: var(--esp-1); }
  .suggestions li { flex: 1 1 0; min-width: 0; justify-content: center; padding: 0 var(--esp-2); background: var(--c-surface-2); border: var(--trait-fin) solid var(--c-trait); border-radius: var(--rayon-1); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .suggestions li + li { border-top: var(--trait-fin) solid var(--c-trait); }
  .suggestions li.actif { border-color: var(--c-accent); }
  .suggestions li .touche { display: none; }
  .suggestions li:nth-child(n+4) { display: none; }
  .revelation { padding: var(--esp-2) var(--esp-3); flex-wrap: wrap; gap: 0 var(--esp-2); }
  .revelation .nom { font-size: var(--taille-base); }
  .revelation .detail { margin-left: 0; width: 100%; order: 3; font-size: var(--taille-petite); }
  .revelation .points { font-size: var(--taille-base); margin-left: auto; }
}
@media (max-width: 719px) and (max-height: 500px) {
  .photo { min-height: 8rem; }
}
</style>
</head>

<script>
// ---------------------------------------------------------------------------------------------
// Données factices et logique minimale (autocomplétion, erreurs, chrono)
// ---------------------------------------------------------------------------------------------
const SITES = ['Belleville', 'Blayais', 'Bugey', 'Cattenom', 'Chinon', 'Chooz', 'Civaux', 'Cruas', 'Dampierre',
  'Flamanville', 'Golfech', 'Gravelines', 'Nogent-sur-Seine', 'Paluel', 'Penly', 'Saint-Alban', 'Saint-Laurent-des-Eaux', 'Tricastin'];
const REPONSES = ['Tricastin', 'Penly', 'Civaux', 'Bugey', 'Cattenom', 'Chinon', 'Paluel', 'Blayais'];
const DUREE = 20, PENALITE = 2, SEUIL_ALERTE = 5;
const q = new URLSearchParams(location.search);
const $ = id => document.getElementById(id);
document.body.dataset.typo = q.get('typo') || 'plex';
document.body.dataset.palette = q.get('palette') || 'tcherenkov';
const BARRE = q.get('barre') || 'lineaire';
const FIGE = q.has('t');
const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[-'’]/g, ' ').replace(/\bst\b/g, 'saint').trim();
const fmt = (n, d = 1) => n.toFixed(d).replace('.', ',');
const milliers = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
const icone = id => `<svg class="icone"><use href="#i-${id}"/></svg>`;

const etat = {
  round: 3, score: 1640, reponse: 'Tricastin', debut: performance.now(), penalite: 0,
  restant: FIGE ? +q.get('t') : DUREE, etat: q.get('etat') || 'jeu', tentes: [], actif: 0, derniereErreur: null,
};
if (FIGE && (etat.etat === 'erreur' || etat.etat === 'perdu' || etat.etat === 'bonne')) etat.tentes = ['Cruas', 'Saint-Alban'];
if (FIGE && etat.etat === 'erreur') etat.derniereErreur = { a: etat.restant, nom: 'Saint-Alban' };

function suggestions(saisie) {
  const n = norm(saisie);
  if (!n) return [];
  return SITES.filter(s => norm(s).startsWith(n) || norm(s).split(' ').some(m => m.startsWith(n))).slice(0, 5);
}

// --- Barre de temps : trois métaphores ------------------------------------------------------
function graduations() {
  let h = '';
  for (let s = 0; s <= DUREE; s++) {
    const x = (s / DUREE * 100) + '%';
    h += `<i class="${s % 5 ? '' : 'maj'}" style="left:${x}"></i>`;
    if (s % 5 === 0) h += `<b style="left:${x}">${s}</b>`;
  }
  return `<div class="graduations">${h}</div>`;
}
function rendreBarre(r) {
  const f = Math.max(0, r) / DUREE;
  const err = etat.etat === 'erreur' && etat.derniereErreur;
  const j = $('jauge');
  if (BARRE === 'lineaire') {
    // Barre linéaire : son bord droit, lu sur l'échelle 0-20, donne les secondes restantes.
    const p0 = f * 100, p1 = Math.min(1, f + PENALITE / DUREE) * 100;
    j.innerHTML = `<div class="rail"><div class="rempli" style="width:${p0}%"></div>${err ? `<div class="perte" style="left:${p0}%;width:${p1 - p0}%"></div>` : ''}</div>`
      + (err ? `<span class="moins" style="left:${(p0 + p1) / 2}%">−2 s</span>` : '') + graduations();
  } else if (BARRE === 'expo') {
    // Décroissance : aire restante sous N(t) = exp(−t/τ), τ = 5 s, t = temps écoulé.
    const tau = 5, W = 1000, H = 48, ecoule = DUREE - Math.max(0, r);
    const y = t => H - H * Math.exp(-t / tau);
    const pts = (a, b) => { let p = ''; for (let i = 0; i <= 80; i++) { const t = a + (b - a) * i / 80; p += `${t / DUREE * W},${y(t)} `; } return p; };
    const aire = (a, b, c) => `<polygon points="${a / DUREE * W},${H} ${pts(a, b)} ${b / DUREE * W},${H}" fill="${c}"/>`;
    let s = `<svg class="courbe" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">`;
    s += aire(0, DUREE, 'var(--c-surface-2)');
    if (ecoule < DUREE) s += aire(ecoule, DUREE, etat.restant < SEUIL_ALERTE ? 'var(--c-erreur)' : 'var(--c-accent)');
    if (err) s += aire(Math.max(0, ecoule - PENALITE), ecoule, 'var(--c-erreur)');
    s += `<polyline points="${pts(0, DUREE)}" fill="none" stroke="var(--c-texte-3)" stroke-width="1" vector-effect="non-scaling-stroke"/></svg>`;
    j.innerHTML = s + (err ? `<span class="moins" style="left:${(ecoule - 1) / DUREE * 100}%">−2 s</span>` : '') + graduationsEcoule();
  } else {
    // Grappes de commande : 20 barres (1 par seconde) qui s'insèrent l'une après l'autre.
    let h = '<div class="grappes">';
    for (let i = 0; i < DUREE; i++) {
      // la barre i couvre la seconde restante ]i, i+1] ; insertion = fraction écoulée de cette seconde
      const ins = Math.min(1, Math.max(0, (i + 1) - Math.max(0, r)));
      const chute = err && i >= Math.floor(r) && i < r + PENALITE;
      h += `<span class="${chute ? 'chute' : ''}"><u style="height:${ins * 100}%"></u></span>`;
    }
    j.innerHTML = h + '</div>' + (err ? `<span class="moins" style="left:${(r + 1) / DUREE * 100}%">−2 s</span>` : '') + graduations();
  }
}
function graduationsEcoule() {
  // Pour l'exponentielle, l'axe est le temps écoulé (0 à gauche) : on l'étiquette en temps restant.
  let h = '';
  for (let s = 0; s <= DUREE; s += 5) h += `<i class="maj" style="left:${s / DUREE * 100}%"></i><b style="left:${s / DUREE * 100}%">${DUREE - s}</b>`;
  return `<div class="graduations">${h}</div>`;
}

// --- Rendu général -----------------------------------------------------------------------------
function rendre() {
  const r = Math.max(0, etat.restant);
  document.body.dataset.etat = etat.etat;
  if (r < SEUIL_ALERTE && etat.etat !== 'bonne') document.body.dataset.alerte = ''; else delete document.body.dataset.alerte;
  $('chrono').textContent = fmt(r); // pas de zéro de tête ; largeur fixe assurée par le CSS (4ch, aligné à droite)
  rendreBarre(r);
  $('round').textContent = String(etat.round).padStart(2, '0') + '/08';
  $('score').textContent = milliers(etat.score);
  let v = '';
  for (let i = 1; i <= 8; i++) {
    const c = i < etat.round ? (i === 2 && etat.round > 3 ? 'ko' : 'ok') : i === etat.round ? 'encours' : '';
    v += `<li class="${c}">${c === 'ko' ? icone('ko') : ''}</li>`;
  }
  $('voyants').innerHTML = v;
  const essais = etat.tentes.length ? `<span class="libelle">Essais</span>` + etat.tentes.map(t => `<s>${t}</s>`).join('') : '';
  $('essais').innerHTML = essais; $('essais-photo').innerHTML = essais;
  const saisie = $('saisie').value;
  const sug = etat.etat === 'jeu' || etat.etat === 'erreur' ? suggestions(saisie) : [];
  etat.actif = Math.min(etat.actif, Math.max(0, sug.length - 1));
  const premier = sug[etat.actif];
  $('fantome').innerHTML = premier && norm(premier).startsWith(norm(saisie)) && saisie
    ? `<span>${saisie}</span>${premier.slice(saisie.length)}` : '';
  $('suggestions').innerHTML = sug.map((s, i) => {
    const n = norm(saisie).length;
    return `<li role="option" class="${i === etat.actif ? 'actif' : ''}" data-nom="${s}"><span><mark>${s.slice(0, n)}</mark>${s.slice(n)}</span><span class="touche">Tab</span></li>`;
  }).join('');
  const m = $('message');
  m.innerHTML = etat.etat === 'erreur' && etat.derniereErreur ? `${icone('ko')}<span>${etat.derniereErreur.nom} : non. −2 s</span>` : '';
  const rev = $('revelation');
  const pts = Math.round(100 + 900 * r / DUREE);
  if (etat.etat === 'bonne') { rev.className = 'revelation'; rev.innerHTML = `${icone('ok')}<span class="nom">${etat.reponse}</span><span class="detail num">${fmt(r)} s restantes · ${etat.tentes.length} erreur${etat.tentes.length > 1 ? 's' : ''}</span><span class="points num">+${pts}</span>`; }
  else if (etat.etat === 'perdu') { rev.className = 'revelation perdu'; rev.innerHTML = `${icone('ko')}<span class="nom">${etat.reponse}</span><span class="detail">Temps écoulé : c'était ce site.</span><span class="points num">+0</span>`; }
}

// --- Mesures pour les tests (design/outils/capturer.mjs) -----------------------------------------
window.zoneBarre = () => { const b = $('jauge').getBoundingClientRect(); return { x: Math.floor(b.x), y: Math.floor(b.y), width: Math.ceil(b.width), height: Math.ceil(b.height) }; };
window.mesures = () => {
  const vh = innerHeight, vw = innerWidth, box = el => el.getBoundingClientRect();
  const visible = el => { const b = box(el); return b.height > 0 && b.top >= 0 && b.bottom <= vh + 0.5; };
  const photo = box(document.querySelector('.photo'));
  return {
    vue: `${vw}x${vh}`,
    taille_chrono_px: parseFloat(getComputedStyle($('chrono')).fontSize),
    taille_score_px: parseFloat(getComputedStyle($('score')).fontSize),
    taille_saisie_px: parseFloat(getComputedStyle($('saisie')).fontSize),
    photo_part_ecran: +(photo.width * photo.height / (vw * vh)).toFixed(2),
    photo_px: `${Math.round(photo.width)}x${Math.round(photo.height)}`,
    tout_visible: ['jauge', 'chrono', 'zone', 'suggestions'].every(id => !$(id).children.length && id === 'suggestions' || visible($(id))) && photo.height > 100,
  };
};

// --- Démo jouable --------------------------------------------------------------------------------
const saisieEl = $('saisie');
if (FIGE) saisieEl.value = q.get('saisie') || (etat.etat === 'bonne' ? 'Tricastin' : '');
function valider(nom) {
  if (etat.etat === 'bonne' || etat.etat === 'perdu') return;
  const cible = SITES.find(s => norm(s) === norm(nom));
  if (!cible) return; // une saisie inconnue n'est pas une erreur
  if (cible === etat.reponse) { etat.etat = 'bonne'; etat.score += Math.round(100 + 900 * etat.restant / DUREE); saisieEl.value = cible; finRound(1500); }
  else {
    etat.penalite += PENALITE; etat.tentes.push(cible); etat.derniereErreur = { a: etat.restant, nom: cible };
    etat.etat = 'jeu'; rendre(); void document.body.offsetWidth; etat.etat = 'erreur';
    saisieEl.value = ''; navigator.vibrate?.(80);
    clearTimeout(etat.minuteur); etat.minuteur = setTimeout(() => { if (etat.etat === 'erreur') { etat.etat = 'jeu'; rendre(); } }, 1400);
  }
  rendre();
}
function finRound(delai) {
  setTimeout(() => {
    etat.round = etat.round % 8 + 1; etat.reponse = REPONSES[(etat.round - 1) % REPONSES.length];
    etat.tentes = []; etat.penalite = 0; etat.debut = performance.now(); etat.etat = 'jeu'; saisieEl.value = ''; rendre();
  }, delai);
}
saisieEl.addEventListener('input', () => { etat.actif = 0; rendre(); });
saisieEl.addEventListener('keydown', e => {
  const sug = suggestions(saisieEl.value);
  if (e.key === 'Tab' && sug.length) { e.preventDefault(); saisieEl.value = sug[etat.actif]; rendre(); }
  else if (e.key === 'ArrowDown') { e.preventDefault(); etat.actif = Math.min(sug.length - 1, etat.actif + 1); rendre(); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); etat.actif = Math.max(0, etat.actif - 1); rendre(); }
  else if (e.key === 'Enter') { e.preventDefault(); valider(SITES.find(s => norm(s) === norm(saisieEl.value)) || sug[etat.actif] || ''); }
});
$('suggestions').addEventListener('click', e => { const li = e.target.closest('li'); if (li) valider(li.dataset.nom); });
function boucle() {
  if (etat.etat === 'jeu' || etat.etat === 'erreur') {
    etat.restant = DUREE - (performance.now() - etat.debut) / 1000 - etat.penalite;
    if (etat.restant <= 0) { etat.restant = 0; etat.etat = 'perdu'; finRound(3000); }
    rendre();
  }
  requestAnimationFrame(boucle);
}
rendre();
if (!FIGE) { saisieEl.focus(); requestAnimationFrame(boucle); }
document.fonts.ready.then(() => Promise.all([...document.fonts].filter(f => f.status !== 'loaded').map(f => f.load().catch(() => {})))).then(() => { rendre(); document.body.dataset.pret = '1'; });
</script>
</body>
